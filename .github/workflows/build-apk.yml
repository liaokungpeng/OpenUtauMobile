name: Build Android APK (AutoTune)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "构建配置（Debug 快、Release 流畅但久）"
        required: true
        default: "Debug"
        type: choice
        options:
          - Debug
          - Release
      rid:
        description: "目标架构"
        required: true
        default: "android-arm64"
        type: choice
        options:
          - android-arm64
          - android-arm
          - android-x64

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet9

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply AutoTune patch
        run: |
          set -e
          if git apply --reverse --check autotune.patch 2>/dev/null; then
            echo "补丁已经应用过，跳过"
          else
            git apply autotune.patch
            echo "补丁应用成功"
          fi
          git --no-pager diff --stat

      - name: Install .NET 9 SDK
        run: |
          set -e
          curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 9.0 --install-dir "$DOTNET_INSTALL_DIR"
          echo "$DOTNET_INSTALL_DIR" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$DOTNET_INSTALL_DIR" >> "$GITHUB_ENV"
          "$DOTNET_INSTALL_DIR/dotnet" --version
          "$DOTNET_INSTALL_DIR/dotnet" --list-sdks

      - name: Install MAUI Android workload
        run: |
          set -e
          dotnet --version
          dotnet workload install maui-android
          dotnet workload list

      - name: Publish APK
        env:
          CONFIG: ${{ inputs.configuration }}
          RID: ${{ inputs.rid }}
        run: |
          set -e
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj \
            -c "$CONFIG" \
            -f net9.0-android \
            -r "$RID" \
            -p:TargetFrameworks=net9.0-android \
            -p:AndroidPackageFormat=apk \
            -p:AndroidKeyStore=false \
            -p:JavaMaximumHeapSize=4G
          echo "== 产物 =="
          find OpenUtauMobile/bin/"$CONFIG"/net9.0-android -name '*.apk' -exec ls -lh {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.configuration }}-${{ inputs.rid }}
          path: OpenUtauMobile/bin/${{ inputs.configuration }}/net9.0-android/**/publish/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Attach APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: autotune-${{ inputs.configuration }}-${{ github.run_number }}
          name: AutoTune ${{ inputs.configuration }} build #${{ github.run_number }}
          body: |
            补丁版 OpenUtau Mobile（自动调音）。
            装之前先卸载原版，否则会提示「应用未安装」。
          files: OpenUtauMobile/bin/${{ inputs.configuration }}/net9.0-android/**/publish/*.apk
